<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCHOOL SERVER — PC 2</title><link rel="stylesheet" href="./style.css"></head><body><main class="panel" id="panel"><div class="status" id="connection">● CONNESSIONE AL SERVER...</div><section id="locked"><h1>ACCESS ERROR</h1><h2>ACCESS DENIED</h2><p>ERRORE DI ACCESSO AL SISTEMA SCOLASTICO.</p><p class="muted">SERVER BLOCCATO — IN ATTESA DELLE 8 CHIAVI DAL TERMINALE PRINCIPALE.</p><p class="message">NON CHIUDERE QUESTA FINESTRA.</p></section><section class="success" id="success"><div class="check">✓</div><h2>ACCESS GRANTED</h2><h3>SISTEMA SBLOCCATO</h3><p>SERVER SCOLASTICO RIPRISTINATO</p><p class="muted">CARICAMENTO DESKTOP...</p></section></main><section class="desktop" id="desktop" aria-label="Desktop scolastico ripristinato"><img src="./desktop.jpg" alt="Schermata desktop della scuola"></section><script type="module">
import {connect} from './firebase-client.js';
const $=id=>document.getElementById(id);let timer=null;let lastUnlocked=false;
function render(state,error){if(error){$('connection').textContent='● ERRORE DI SINCRONIZZAZIONE: '+error.message;return;}const unlocked=!!state?.unlocked;$('connection').textContent='● SERVER ONLINE — SINCRONIZZATO';if(unlocked===lastUnlocked)return;lastUnlocked=unlocked;if(timer){clearTimeout(timer);timer=null;}$('desktop').classList.remove('show');$('locked').classList.toggle('hidden',unlocked);$('success').classList.toggle('show',unlocked);if(unlocked){timer=setTimeout(()=>$('desktop').classList.add('show'),5000);}}
try{await connect(render);}catch(e){$('connection').textContent='● ERRORE DI CONNESSIONE: '+e.message;}
</script></body></html>
